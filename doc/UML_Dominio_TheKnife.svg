<svg viewBox="0 0 1500 1000" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Diagramma delle classi UML del dominio TheKnife: l'interfaccia ServiziTK opera su Utente (astratta, specializzata in Cliente e Ristoratore), Ristorante e Recensione, con le relative associazioni e molteplicita'.">
  <rect x="0" y="0" width="1500" height="1000" fill="#fffdf8"/>

  <defs>
    <marker id="triangolo" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto">
      <path d="M0,0 L16,7 L0,14 z" fill="#fffdf8" stroke="#333333" stroke-width="1.2"/>
    </marker>
    <marker id="freccia-aperta" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#555555" stroke-width="1.2"/>
    </marker>
  </defs>

  <style>
    .classe   { fill: #fdf6ec; stroke: #7a2e2e; stroke-width: 2; }
    .iface    { fill: #eef3f8; stroke: #2e4a7a; stroke-width: 2; }
    .titolo   { font: bold 15px sans-serif; fill: #7a2e2e; text-anchor: middle; }
    .titoloI  { font: bold 15px sans-serif; fill: #2e4a7a; text-anchor: middle; }
    .stereo   { font: italic 11px sans-serif; fill: #555555; text-anchor: middle; }
    .campo    { font: 11.5px monospace; fill: #222222; }
    .metodo   { font: 10.5px monospace; fill: #1c3a63; }
    .lbl      { font: bold 12px sans-serif; fill: #222222; text-anchor: middle; }
    .mult     { font: 11px sans-serif; fill: #444444; }
    .relaz    { stroke: #333333; stroke-width: 1.4; fill: none; }
    .dip      { stroke: #777777; stroke-width: 1.2; fill: none; stroke-dasharray: 5,4; }
  </style>

  <!-- ================= ServiziTK (interfaccia) ================= -->
  <rect class="iface" x="500" y="20" width="480" height="290" rx="4"/>
  <text class="stereo" x="740" y="38">«interface»</text>
  <text class="titoloI" x="740" y="56">ServiziTK</text>
  <line x1="508" y1="66" x2="972" y2="66" stroke="#2e4a7a"/>
  <text class="metodo" x="516" y="84">+cercaRistorante(criteri)</text>
  <text class="metodo" x="516" y="100">+visualizzaRistorante(id)</text>
  <text class="metodo" x="516" y="116">+visualizzaRecensioni(idRist)</text>
  <text class="metodo" x="516" y="132">+registrazione(utente, pwd)</text>
  <text class="metodo" x="516" y="148">+login(email, pwd, ruolo)</text>
  <text class="metodo" x="516" y="164">+aggiungiPreferito(idCli,idRist)</text>
  <text class="metodo" x="516" y="180">+rimuoviPreferito(idCli,idRist)</text>
  <text class="metodo" x="516" y="196">+visualizzaPreferiti(idCli)</text>
  <text class="metodo" x="748" y="84">+aggiungiRecensione(idCli,idRist,stelle,testo)</text>
  <text class="metodo" x="748" y="100">+modificaRecensione(idCli,idRec,stelle,testo)</text>
  <text class="metodo" x="748" y="116">+eliminaRecensione(idCli,idRec)</text>
  <text class="metodo" x="748" y="132">+visualizzaRecensioniProprie(idCli)</text>
  <text class="metodo" x="748" y="148">+aggiungiRistorante(idRistoratore,r,cucine)</text>
  <text class="metodo" x="748" y="164">+visualizzaRiepilogo(idRistoratore)</text>
  <text class="metodo" x="748" y="180">+rispostaRecensione(idRistoratore,idRec,txt)</text>
  <text class="stereo" x="740" y="300">implementata da ServiziTKImpl (server) e ServiziTKProxy (client) - vedi diagramma architetturale</text>

  <!-- ================= Ruolo (enum) ================= -->
  <rect class="classe" x="60" y="360" width="170" height="95" rx="4"/>
  <text class="stereo" x="145" y="378">«enumeration»</text>
  <text class="titolo" x="145" y="396">Ruolo</text>
  <line x1="66" y1="404" x2="224" y2="404" stroke="#7a2e2e"/>
  <text class="campo" x="76" y="422">CLIENTE</text>
  <text class="campo" x="76" y="438">RISTORATORE</text>

  <!-- ================= Utente (astratta) ================= -->
  <rect class="classe" x="420" y="360" width="260" height="190" rx="4"/>
  <text class="stereo" x="550" y="378">«abstract»</text>
  <text class="titolo" x="550" y="396">Utente</text>
  <line x1="426" y1="404" x2="674" y2="404" stroke="#7a2e2e"/>
  <text class="campo" x="432" y="420">-id: int</text>
  <text class="campo" x="432" y="435">-nome, cognome: String</text>
  <text class="campo" x="432" y="450">-email, username: String</text>
  <text class="campo" x="432" y="465">-dataNascita: LocalDate</text>
  <text class="campo" x="432" y="480">-nazione/cittaDomicilio: String</text>
  <text class="campo" x="432" y="495">-dataRegistrazione: LocalDateTime</text>
  <line x1="426" y1="503" x2="674" y2="503" stroke="#7a2e2e"/>
  <text class="metodo" x="432" y="519">+getRuolo(): Ruolo {abstract}</text>
  <text class="metodo" x="432" y="534">+getNomeCompleto(): String</text>

  <!-- ================= Ristorante ================= -->
  <rect class="classe" x="1120" y="360" width="270" height="230" rx="4"/>
  <text class="titolo" x="1255" y="380">Ristorante</text>
  <line x1="1126" y1="388" x2="1384" y2="388" stroke="#7a2e2e"/>
  <text class="campo" x="1132" y="404">-id: int</text>
  <text class="campo" x="1132" y="419">-nome, nazione, citta, indirizzo: String</text>
  <text class="campo" x="1132" y="434">-fasciaPrezzo: BigDecimal</text>
  <text class="campo" x="1132" y="449">-delivery, prenotazioneOnline: boolean</text>
  <text class="campo" x="1132" y="464">-idRistoratore: int</text>
  <text class="campo" x="1132" y="479">-tipiCucina: List&lt;String&gt;</text>
  <text class="campo" x="1132" y="494">-mediaStelle: double</text>
  <text class="campo" x="1132" y="509">-numeroRecensioni: int</text>
  <line x1="1126" y1="518" x2="1384" y2="518" stroke="#7a2e2e"/>
  <text class="metodo" x="1132" y="534">+get/set su tutti i campi</text>
  <text class="metodo" x="1132" y="549">(getter/setter JavaBean)</text>

  <!-- ================= Cliente ================= -->
  <rect class="classe" x="180" y="600" width="180" height="80" rx="4"/>
  <text class="titolo" x="270" y="620">Cliente</text>
  <line x1="186" y1="628" x2="354" y2="628" stroke="#7a2e2e"/>
  <text class="metodo" x="192" y="646">+getRuolo(): Ruolo</text>
  <text class="metodo" x="192" y="661">= CLIENTE</text>

  <!-- ================= Ristoratore ================= -->
  <rect class="classe" x="650" y="600" width="200" height="80" rx="4"/>
  <text class="titolo" x="750" y="620">Ristoratore</text>
  <line x1="656" y1="628" x2="844" y2="628" stroke="#7a2e2e"/>
  <text class="metodo" x="662" y="646">+getRuolo(): Ruolo</text>
  <text class="metodo" x="662" y="661">= RISTORATORE</text>

  <!-- ================= Recensione ================= -->
  <rect class="classe" x="960" y="700" width="270" height="220" rx="4"/>
  <text class="titolo" x="1095" y="720">Recensione</text>
  <line x1="966" y1="728" x2="1224" y2="728" stroke="#7a2e2e"/>
  <text class="campo" x="972" y="744">-id: int</text>
  <text class="campo" x="972" y="759">-idRistorante, idCliente: int</text>
  <text class="campo" x="972" y="774">-stelle: int  (1..5)</text>
  <text class="campo" x="972" y="789">-testo: String</text>
  <text class="campo" x="972" y="804">-dataRecensione, dataModifica: LocalDateTime</text>
  <text class="campo" x="972" y="819">-rispostaTesto: String</text>
  <text class="campo" x="972" y="834">-dataRisposta: LocalDateTime</text>
  <line x1="966" y1="843" x2="1224" y2="843" stroke="#7a2e2e"/>
  <text class="metodo" x="972" y="859">+isRisposta(): boolean</text>
  <text class="metodo" x="972" y="874">+get/set su tutti i campi</text>

  <!-- ================= RELAZIONI ================= -->

  <!-- Ereditarieta' -->
  <line class="relaz" x1="270" y1="600" x2="470" y2="510" marker-end="url(#triangolo)"/>
  <line class="relaz" x1="750" y1="600" x2="630" y2="510" marker-end="url(#triangolo)"/>

  <!-- Dipendenza Utente -> Ruolo -->
  <line class="dip" x1="420" y1="420" x2="230" y2="404" marker-end="url(#freccia-aperta)"/>
  <text class="stereo" x="330" y="405">«use»</text>

  <!-- Ristoratore possiede Ristorante (1 a 0..*) -->
  <line class="relaz" x1="850" y1="625" x2="1120" y2="470"/>
  <text class="lbl" x="990" y="560">possiede</text>
  <text class="mult" x="858" y="615">1</text>
  <text class="mult" x="1098" y="475">0..*</text>

  <!-- Cliente scrive Recensione (1 a 0..*) -->
  <line class="relaz" x1="360" y1="655" x2="960" y2="790"/>
  <text class="lbl" x="660" y="735">scrive</text>
  <text class="mult" x="368" y="670">1</text>
  <text class="mult" x="935" y="785">0..*</text>

  <!-- Ristorante riguarda Recensione (1 a 0..*) -->
  <line class="relaz" x1="1200" y1="605" x2="1130" y2="700"/>
  <text class="lbl" x="1210" y="655">riguarda</text>
  <text class="mult" x="1180" y="620">1</text>
  <text class="mult" x="1140" y="695">0..*</text>

  <!-- Cliente preferisce Ristorante (0..* a 0..*) -->
  <line class="relaz" x1="360" y1="615" x2="1120" y2="430" stroke-dasharray="2,3"/>
  <text class="lbl" x="740" y="500">preferiti {data_aggiunta}</text>
  <text class="mult" x="368" y="605">0..*</text>
  <text class="mult" x="1098" y="435">0..*</text>

  <!-- Dipendenze ServiziTK -->
  <line class="dip" x1="620" y1="310" x2="570" y2="360" marker-end="url(#freccia-aperta)"/>
  <line class="dip" x1="900" y1="310" x2="1200" y2="360" marker-end="url(#freccia-aperta)"/>
</svg>
