<svg viewBox="0 0 1650 980" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Diagramma architetturale di TheKnife: il client (JavaFX, pattern MVC e Proxy remoto) comunica via socket TCP con oggetti Richiesta/Risposta serializzati verso il server (pattern Facade e DAO), che accede al database PostgreSQL dbTK tramite JDBC.">
  <rect x="0" y="0" width="1650" height="980" fill="#fffdf8"/>

  <defs>
    <marker id="triangolo2" markerWidth="16" markerHeight="14" refX="15" refY="7" orient="auto">
      <path d="M0,0 L16,7 L0,14 z" fill="#fffdf8" stroke="#333333" stroke-width="1.2"/>
    </marker>
    <marker id="freccia2" markerWidth="10" markerHeight="9" refX="9" refY="4.5" orient="auto">
      <path d="M0,0 L10,4.5 L0,9 z" fill="#333333"/>
    </marker>
  </defs>

  <style>
    .pkg      { fill: none; stroke: #999999; stroke-width: 1.6; stroke-dasharray: 7,4; }
    .pkgLbl   { font: bold 13px sans-serif; fill: #666666; }
    .classe   { fill: #fdf6ec; stroke: #7a2e2e; stroke-width: 1.8; }
    .iface    { fill: #eef3f8; stroke: #2e4a7a; stroke-width: 1.8; }
    .db       { fill: #eef8ee; stroke: #2e6a3a; stroke-width: 1.8; }
    .titolo   { font: bold 13px sans-serif; fill: #7a2e2e; text-anchor: middle; }
    .titoloI  { font: bold 13px sans-serif; fill: #2e4a7a; text-anchor: middle; }
    .stereo   { font: italic 10.5px sans-serif; fill: #555555; text-anchor: middle; }
    .voce     { font: 10.5px monospace; fill: #222222; }
    .lbl      { font: bold 11.5px sans-serif; fill: #222222; text-anchor: middle; }
    .nota     { font: italic 11px sans-serif; fill: #8a4a1e; text-anchor: middle; }
    .relaz    { stroke: #333333; stroke-width: 1.4; fill: none; }
    .dip      { stroke: #777777; stroke-width: 1.2; fill: none; stroke-dasharray: 5,4; }
    .canale   { stroke: #7a2e2e; stroke-width: 2.6; fill: none; }
  </style>

  <!-- ================= PACKAGE theknife.client ================= -->
  <rect class="pkg" x="30" y="30" width="510" height="920"/>
  <text class="pkgLbl" x="45" y="52">«package» theknife.client</text>

  <rect class="classe" x="70" y="70" width="190" height="46"/>
  <text class="titolo" x="165" y="98">ClientTK</text>
  <rect class="classe" x="330" y="70" width="170" height="46"/>
  <text class="titolo" x="415" y="98">LauncherClient</text>

  <rect class="classe" x="70" y="140" width="190" height="46"/>
  <text class="titolo" x="165" y="168">Navigatore</text>
  <rect class="classe" x="330" y="140" width="170" height="46"/>
  <text class="titolo" x="415" y="168">SessioneClient</text>

  <rect class="pkg" x="60" y="210" width="450" height="190" stroke="#7a7a2e"/>
  <text class="pkgLbl" x="75" y="230" fill="#7a7a2e">controller (MVC: View = FXML)</text>
  <text class="voce" x="80" y="250">MenuIniziale · Login · Registrazione</text>
  <text class="voce" x="80" y="266">Home · Ricerca · Preferiti</text>
  <text class="voce" x="80" y="282">MieiRistoranti · MieRecensioni</text>
  <text class="voce" x="80" y="298">DettaglioRistorante · AggiungiRistorante</text>
  <text class="voce" x="80" y="314">BarraNavigazione</text>
  <text class="nota" x="285" y="345">Model = theknife.common.model</text>
  <text class="nota" x="285" y="362">(le classi dominio non contengono codice JavaFX)</text>

  <rect class="pkg" x="60" y="430" width="450" height="130" stroke="#2e4a7a"/>
  <text class="pkgLbl" x="75" y="450" fill="#2e4a7a">rete</text>
  <rect class="classe" x="90" y="465" width="180" height="55"/>
  <text class="titolo" x="180" y="490">ConnessioneServer</text>
  <text class="stereo" x="180" y="505">socket + object stream</text>
  <rect class="classe" x="310" y="465" width="170" height="55"/>
  <text class="titolo" x="395" y="490">ServiziTKProxy</text>
  <text class="stereo" x="395" y="1000" style="display:none"/>
  <text class="nota" x="395" y="537">«Proxy remoto»</text>

  <!-- ================= PACKAGE theknife.common ================= -->
  <rect class="pkg" x="580" y="30" width="380" height="920"/>
  <text class="pkgLbl" x="595" y="52">«package» theknife.common</text>

  <rect class="iface" x="610" y="90" width="320" height="80"/>
  <text class="stereo" x="770" y="108">«interface»</text>
  <text class="titoloI" x="770" y="126">ServiziTK</text>
  <text class="stereo" x="770" y="144">15 operazioni (login, cercaRistorante,</text>
  <text class="stereo" x="770" y="158">aggiungiRecensione, rispostaRecensione, ...)</text>

  <rect class="classe" x="610" y="210" width="320" height="70"/>
  <text class="titolo" x="770" y="232">model</text>
  <text class="voce" x="625" y="250">Utente, Cliente, Ristoratore,</text>
  <text class="voce" x="625" y="265">Ristorante, Recensione</text>
  <text class="stereo" x="770" y="292">(diagramma UML_Dominio_TheKnife.svg)</text>

  <rect class="classe" x="610" y="320" width="320" height="90"/>
  <text class="titolo" x="770" y="342">protocol</text>
  <text class="voce" x="625" y="360">Operazione «enum», Richiesta,</text>
  <text class="voce" x="625" y="375">Risposta, CriteriRicerca</text>
  <text class="stereo" x="770" y="398">(oggetti Serializable scambiati sul socket)</text>

  <rect class="classe" x="610" y="440" width="320" height="70"/>
  <text class="titolo" x="770" y="462">util</text>
  <text class="voce" x="625" y="480">TheKnifeException</text>
  <text class="voce" x="625" y="495">PasswordUtil (hash BCrypt)</text>

  <!-- ================= PACKAGE theknife.server ================= -->
  <rect class="pkg" x="990" y="30" width="620" height="920"/>
  <text class="pkgLbl" x="1005" y="52">«package» theknife.server</text>

  <rect class="classe" x="1030" y="90" width="190" height="55"/>
  <text class="titolo" x="1125" y="113">ServerTK</text>
  <text class="stereo" x="1125" y="130">main: ServerSocket.accept()</text>

  <rect class="classe" x="1280" y="90" width="220" height="55"/>
  <text class="titolo" x="1390" y="113">GestoreClient</text>
  <text class="stereo" x="1390" y="130">Runnable, 1 per connessione</text>

  <text class="nota" x="1245" y="80">crea 1 thread per client →</text>

  <rect class="pkg" x="1020" y="180" width="480" height="80" stroke="#7a2e2e"/>
  <text class="pkgLbl" x="1035" y="200" fill="#7a2e2e">service</text>
  <rect class="classe" x="1040" y="210" width="440" height="40"/>
  <text class="titolo" x="1260" y="234">ServiziTKImpl</text>
  <text class="nota" x="1260" y="270">«Facade» sui DAO</text>

  <rect class="pkg" x="1020" y="300" width="480" height="190" stroke="#2e6a3a"/>
  <text class="pkgLbl" x="1035" y="320" fill="#2e6a3a">dao «DAO»</text>
  <rect class="classe" x="1040" y="335" width="210" height="40"/>
  <text class="titolo" x="1145" y="359">UtenteDAO</text>
  <rect class="classe" x="1270" y="335" width="210" height="40"/>
  <text class="titolo" x="1375" y="359">RistoranteDAO</text>
  <rect class="classe" x="1040" y="385" width="210" height="40"/>
  <text class="titolo" x="1145" y="409">RecensioneDAO</text>
  <rect class="classe" x="1270" y="385" width="210" height="40"/>
  <text class="titolo" x="1375" y="409">PreferitoDAO</text>
  <rect class="classe" x="1040" y="435" width="440" height="40"/>
  <text class="titolo" x="1260" y="459">ConfigurazioneDB</text>

  <!-- DB -->
  <g transform="translate(1180,590)">
    <path class="db" d="M0,15 a140,15 0 1 0 280,0 v70 a140,15 0 1 1 -280,0 z"/>
    <ellipse class="db" cx="140" cy="15" rx="140" ry="15"/>
    <text class="titolo" x="140" y="65" fill="#2e6a3a">dbTK (PostgreSQL)</text>
    <text class="stereo" x="140" y="82">utenti, ristoranti, cucine,</text>
    <text class="stereo" x="140" y="96">recensioni, preferiti</text>
  </g>

  <!-- ================= RELAZIONI ================= -->

  <!-- client: interne -->
  <line class="relaz" x1="260" y1="93" x2="330" y2="93" marker-end="url(#freccia2)"/>
  <line class="relaz" x1="260" y1="163" x2="330" y2="163" marker-end="url(#freccia2)"/>
  <line class="relaz" x1="165" y1="116" x2="165" y2="140" marker-end="url(#freccia2)"/>
  <line class="relaz" x1="415" y1="116" x2="415" y2="140" marker-end="url(#freccia2)"/>
  <line class="relaz" x1="285" y1="290" x2="415" y2="186" marker-end="url(#freccia2)"/>

  <!-- SessioneClient -> ServiziTK (interfaccia, tipo del riferimento) -->
  <line class="dip" x1="500" y1="163" x2="610" y2="130" marker-end="url(#freccia2)"/>

  <!-- ServiziTKProxy ..|> ServiziTK -->
  <line class="dip" x1="480" y1="480" x2="610" y2="160" marker-end="url(#triangolo2)"/>

  <!-- ServiziTKProxy -> ConnessioneServer -->
  <line class="relaz" x1="310" y1="492" x2="270" y2="492" marker-end="url(#freccia2)"/>

  <!-- CANALE: ConnessioneServer == TCP/oggetti serializzati ==> GestoreClient -->
  <path class="canale" d="M480,470 C 700,380 1000,120 1280,110" marker-end="url(#freccia2)"/>
  <text class="lbl" x="850" y="300" fill="#7a2e2e">socket TCP — Richiesta / Risposta serializzate</text>

  <!-- ServerTK -> GestoreClient (crea) -->
  <line class="relaz" x1="1220" y1="110" x2="1280" y2="110" marker-end="url(#freccia2)"/>

  <!-- GestoreClient -> ServiziTKImpl -->
  <line class="relaz" x1="1390" y1="145" x2="1300" y2="210" marker-end="url(#freccia2)"/>

  <!-- ServiziTKImpl ..|> ServiziTK -->
  <line class="dip" x1="1040" y1="220" x2="930" y2="150" marker-end="url(#triangolo2)"/>

  <!-- ServiziTKImpl -> dao -->
  <line class="relaz" x1="1260" y1="250" x2="1260" y2="300" marker-end="url(#freccia2)"/>

  <!-- dao -> DB -->
  <line class="relaz" x1="1260" y1="490" x2="1260" y2="590" marker-end="url(#freccia2)"/>

  <!-- ================= LEGENDA ================= -->
  <g transform="translate(1000,850)">
    <rect x="0" y="0" width="600" height="95" fill="#ffffff" stroke="#999999" stroke-width="1"/>
    <text x="10" y="18" class="lbl" text-anchor="start">Legenda</text>
    <text x="10" y="36" class="stereo" text-anchor="start">— linea continua: dipendenza/uso a runtime · - - - tratteggiata: dipendenza debole</text>
    <text x="10" y="52" class="stereo" text-anchor="start">▷ triangolo tratteggiato: realizzazione di interfaccia</text>
    <text x="10" y="68" class="stereo" text-anchor="start">linea spessa: comunicazione di rete (client/server, un thread per connessione)</text>
    <text x="10" y="84" class="stereo" text-anchor="start">riquadro tratteggiato: package Java</text>
  </g>
</svg>
